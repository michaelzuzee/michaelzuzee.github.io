<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="minor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3b5b7a" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#3b5b7a" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f7fa" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#f5f7fa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1200" fill="#f5f7fa"/>
  <rect width="1920" height="1200" fill="url(#minor)"/>
  <rect width="1920" height="1200" fill="url(#major)"/>

  <!-- Supply and demand, kept to the right so text on the left stays clear -->
  <g fill="none" stroke="#2f6f73" stroke-width="3" stroke-linecap="round" opacity="0.28">
    <path d="M1000 120V800H1880" stroke="#3b5b7a" stroke-width="2"/>
    <path d="M1080 180C1200 480 1500 640 1840 700"/>
    <path d="M1080 720C1300 700 1500 420 1840 160"/>
    <path d="M1000 530H1396M1396 530V800" stroke="#3b5b7a" stroke-width="1.5" stroke-dasharray="6 8"/>
  </g>
  <circle cx="1396" cy="530" r="7" fill="#2f6f73" opacity="0.4"/>

  <!-- Lorenz-style curve, lower left, very faint -->
  <g fill="none" stroke="#3b5b7a" stroke-width="2" opacity="0.14">
    <path d="M120 1100V700M120 1100H520"/>
    <path d="M120 1100L520 700" stroke-dasharray="6 8"/>
    <path d="M120 1100C320 1090 460 1000 520 700" stroke-width="3"/>
  </g>

  <!-- Soft fade so the left side, where text usually sits, stays calm -->
  <rect width="1920" height="1200" fill="url(#fade)"/>
</svg>
