{% include base_path %}

<!-- start custom head snippets -->

<!-- Icons (blue MZ monogram) -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=2">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=2" sizes="32x32">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-16x16.png?v=2" sizes="16x16">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-96x96.png?v=2" sizes="96x96">
<link rel="icon" type="image/png" href="{{ base_path }}/images/android-chrome-192x192.png?v=2" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=2">
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico?v=2">
<meta name="theme-color" content="#0f4c81">

<!-- Preview card when the site is shared on LinkedIn, X, WhatsApp and email -->
<meta property="og:image" content="https://michaelzuzee.github.io/images/social-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://michaelzuzee.github.io/images/social-preview.png">

<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<!-- end custom head snippets -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/custom.css?v=2">
